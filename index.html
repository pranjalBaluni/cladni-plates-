<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Audio Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans h-screen flex flex-col overflow-hidden">

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row h-full overflow-hidden">
        
        <!-- Left Sidebar / Playlist -->
        <aside class="w-full md:w-80 lg:w-96 border-r border-gray-800 bg-gray-900 flex flex-col flex-shrink-0 h-1/2 md:h-full">
            <div class="p-6 border-b border-gray-800 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold text-gray-100 mb-1 tracking-tight">Library</h2>
                    <p class="text-sm text-gray-400" id="track-count">Loading...</p>
                </div>
                <!-- Add Audio Button -->
                <button id="btn-add" class="w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 flex items-center justify-center transition shadow-lg focus:outline-none" title="Add Local Audio File">
                    <i class="fas fa-plus text-white"></i>
                </button>
                <input type="file" id="file-input" accept="audio/*" multiple class="hidden">
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-2" id="playlist">
                <!-- Track items injected by JS -->
            </div>
        </aside>

        <!-- Right / Center Now Playing Area -->
        <section class="flex-1 flex flex-col items-center justify-center p-8 bg-gray-950 relative h-1/2 md:h-full">
            
            <!-- Album Art Box -->
            <div class="w-48 h-48 sm:w-64 sm:h-64 md:w-80 md:h-80 rounded-3xl shadow-2xl bg-gradient-to-br from-indigo-600 to-purple-800 flex items-center justify-center mb-8 relative group transform transition duration-500 hover:scale-[1.02]">
                <div class="absolute inset-0 bg-black bg-opacity-10 rounded-3xl"></div>
                <i class="fas fa-music text-6xl md:text-8xl text-white opacity-90 drop-shadow-lg" id="cover-icon"></i>
            </div>
            
            <h1 class="text-2xl md:text-4xl font-extrabold mb-2 text-center tracking-tight truncate w-full max-w-lg px-4" id="current-title">Select a track</h1>
            <p class="text-gray-400 text-lg md:text-xl text-center font-medium truncate w-full max-w-lg px-4" id="current-artist">Artist</p>
            
        </section>
    </main>

    <!-- Bottom Media Player -->
    <footer class="bg-gray-900 border-t border-gray-800 p-4 md:px-8 h-24 flex items-center justify-between z-20 shrink-0">
        
        <!-- Currently Playing Info (Left) -->
        <div class="flex items-center w-1/3 min-w-[150px]">
            <div class="w-12 h-12 bg-gray-800 rounded-lg flex-shrink-0 items-center justify-center mr-4 hidden sm:flex">
                 <i class="fas fa-compact-disc text-gray-400" id="mini-disc"></i>
            </div>
            <div class="truncate pr-4 w-full">
                <h3 class="text-sm md:text-base font-semibold truncate text-gray-100" id="player-title">No track</h3>
                <p class="text-xs md:text-sm text-gray-400 truncate" id="player-artist">-</p>
            </div>
        </div>

        <!-- Controls & Progress (Center) -->
        <div class="flex flex-col items-center w-1/3 min-w-[200px] max-w-2xl px-2">
            
            <!-- Buttons -->
            <div class="flex items-center space-x-6 mb-2">
                <button class="text-gray-400 hover:text-white transition focus:outline-none" id="btn-prev">
                    <i class="fas fa-backward-step text-lg"></i>
                </button>
                
                <button class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 hover:bg-gray-200 transition focus:outline-none shadow-md" id="btn-play">
                    <i class="fas fa-play ml-1 text-lg" id="play-icon"></i>
                </button>
                
                <button class="text-gray-400 hover:text-white transition focus:outline-none" id="btn-next">
                    <i class="fas fa-forward-step text-lg"></i>
                </button>
            </div>
            
            <!-- Scrubber -->
            <div class="w-full flex items-center space-x-3 text-xs text-gray-400 font-medium">
                <span id="time-current" class="w-10 text-right">0:00</span>
                
                <div class="flex-1 h-1.5 bg-gray-700 rounded-full relative cursor-pointer group" id="progress-container">
                    <div class="absolute top-0 left-0 h-full bg-indigo-500 rounded-full w-0 group-hover:bg-indigo-400 transition-all duration-75" id="progress-bar">
                        <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full opacity-0 group-hover:opacity-100 shadow"></div>
                    </div>
                </div>
                
                <span id="time-total" class="w-10">0:00</span>
            </div>
        </div>

        <!-- Volume (Right) -->
        <div class="w-1/3 flex justify-end items-center space-x-3 hidden md:flex pl-4">
            <i class="fas fa-volume-high text-gray-400 text-sm"></i>
            <input type="range" min="0" max="1" step="0.01" value="1" class="w-24 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-indigo-500" id="volume-slider">
        </div>
    </footer>

    <!-- Native Audio Element -->
    <audio id="audio-element"></audio>

    <script>
        // Dummy Tracks using royalty-free sources
        const tracks = [
            {
                id: 1,
                title: "Lofi Study",
                artist: "aunoo",
                src: "https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3"
            },
            {
                id: 2,
                title: "Good Night",
                artist: "aunoo",
                src: "https://cdn.pixabay.com/audio/2022/10/14/audio_9939f792cb.mp3"
            },
            {
                id: 3,
                title: "Electronic Future",
                artist: "Muzaproduction",
                src: "https://cdn.pixabay.com/audio/2022/11/22/audio_febc508520.mp3"
            },
            {
                id: 4,
                title: "Chill Abstract",
                artist: "Coma-Media",
                src: "https://cdn.pixabay.com/audio/2022/03/15/audio_c8b8175782.mp3"
            }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        
        // DOM Elements
        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('btn-play');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        
        const volumeSlider = document.getElementById('volume-slider');
        const playlistEl = document.getElementById('playlist');
        const trackCount = document.getElementById('track-count');
        
        const currentTitle = document.getElementById('current-title');
        const currentArtist = document.getElementById('current-artist');
        const playerTitle = document.getElementById('player-title');
        const playerArtist = document.getElementById('player-artist');
        const miniDisc = document.getElementById('mini-disc');

        const btnAdd = document.getElementById('btn-add');
        const fileInput = document.getElementById('file-input');

        function init() {
            updateTrackCount();
            renderPlaylist();
            if (tracks.length > 0) {
                loadTrack(currentIndex);
            }
        }

        function updateTrackCount() {
            trackCount.textContent = `${tracks.length} track${tracks.length !== 1 ? 's' : ''}`;
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            
            if (tracks.length === 0) {
                playlistEl.innerHTML = '<p class="text-gray-500 text-sm text-center mt-8">No tracks left. Click the + button to add local audio files.</p>';
                return;
            }

            tracks.forEach((track, index) => {
                const isActive = index === currentIndex;
                const activeClasses = isActive ? 'bg-gray-800 border-indigo-500' : 'bg-transparent border-transparent hover:bg-gray-800/50';
                const textClasses = isActive ? 'text-indigo-400 font-semibold' : 'text-gray-200 font-medium';
                const icon = (isActive && isPlaying) ? 'fa-chart-simple text-indigo-400' : 'fa-music text-gray-400';
                
                const el = document.createElement('div');
                el.className = `p-3 rounded-lg flex items-center transition-colors duration-200 border-l-2 ${activeClasses} group`;
                
                el.innerHTML = `
                    <div class="w-10 h-10 bg-gray-950 rounded flex items-center justify-center flex-shrink-0 mr-3 shadow-inner cursor-pointer track-trigger">
                        <i class="fas ${icon} text-sm"></i>
                    </div>
                    <div class="overflow-hidden flex-1 cursor-pointer track-trigger">
                        <h4 class="text-sm truncate ${textClasses}">${track.title}</h4>
                        <p class="text-xs text-gray-500 truncate">${track.artist}</p>
                    </div>
                    <button class="remove-btn text-gray-600 hover:text-red-500 p-2 transition focus:outline-none opacity-0 group-hover:opacity-100" title="Remove Track">
                        <i class="fas fa-trash-alt text-sm"></i>
                    </button>
                `;

                // Handle click to play
                const triggers = el.querySelectorAll('.track-trigger');
                triggers.forEach(trigger => {
                    trigger.addEventListener('click', () => {
                        currentIndex = index;
                        loadTrack(currentIndex);
                        playTrack();
                    });
                });

                // Handle click to remove
                const removeBtn = el.querySelector('.remove-btn');
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeTrack(index);
                });

                playlistEl.appendChild(el);
            });
        }

        function removeTrack(index) {
            const isCurrentTrack = index === currentIndex;
            
            // Clean up Object URL if it's a local file to free memory
            if (tracks[index].src.startsWith('blob:')) {
                URL.revokeObjectURL(tracks[index].src);
            }
            
            tracks.splice(index, 1);
            
            if (tracks.length === 0) {
                // Handle empty playlist state
                audio.pause();
                audio.src = '';
                isPlaying = false;
                playIcon.className = 'fas fa-play ml-1 text-lg';
                miniDisc.classList.remove('animate-spin');
                currentTitle.textContent = 'Select a track';
                currentArtist.textContent = 'Artist';
                playerTitle.textContent = 'No track';
                playerArtist.textContent = '-';
                timeCurrent.textContent = '0:00';
                timeTotal.textContent = '0:00';
                progressBar.style.width = '0%';
                currentIndex = 0;
            } else {
                // Adjust index if we removed a track before the current one
                if (index < currentIndex) {
                    currentIndex--;
                } 
                // If we removed the currently playing track, move to the next one
                else if (isCurrentTrack) {
                    if (currentIndex >= tracks.length) {
                        currentIndex = 0;
                    }
                    loadTrack(currentIndex);
                    if (isPlaying) {
                        playTrack();
                    } else {
                        pauseTrack(); 
                    }
                }
            }
            
            updateTrackCount();
            renderPlaylist();
        }

        function loadTrack(index) {
            if (tracks.length === 0) return;
            const track = tracks[index];
            audio.src = track.src;
            
            currentTitle.textContent = track.title;
            currentArtist.textContent = track.artist;
            playerTitle.textContent = track.title;
            playerArtist.textContent = track.artist;
            
            renderPlaylist();
        }

        function togglePlay() {
            if (tracks.length === 0) return;
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        }

        function playTrack() {
            if (!audio.src || audio.src === window.location.href) return;
            audio.play().catch(e => console.error("Playback failed", e));
            isPlaying = true;
            playIcon.className = 'fas fa-pause text-lg';
            miniDisc.classList.add('animate-spin');
            renderPlaylist(); 
        }

        function pauseTrack() {
            audio.pause();
            isPlaying = false;
            playIcon.className = 'fas fa-play ml-1 text-lg';
            miniDisc.classList.remove('animate-spin');
            renderPlaylist();
        }

        function prevTrack() {
            if (tracks.length === 0) return;
            currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentIndex);
            playTrack();
        }

        function nextTrack() {
            if (tracks.length === 0) return;
            currentIndex = (currentIndex + 1) % tracks.length;
            loadTrack(currentIndex);
            playTrack();
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Add Local Audio Handlers
        btnAdd.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length === 0) return;

            const wasEmpty = tracks.length === 0;

            Array.from(files).forEach((file, i) => {
                const objectURL = URL.createObjectURL(file);
                const title = file.name.replace(/\.[^/.]+$/, ""); // Remove extension
                
                tracks.push({
                    id: Date.now() + i,
                    title: title,
                    artist: "Local Audio",
                    src: objectURL
                });
            });

            updateTrackCount();
            renderPlaylist();
            
            // Auto-play if it's the first track added
            if (wasEmpty) {
                currentIndex = 0;
                loadTrack(currentIndex);
                playTrack();
            }
            
            fileInput.value = ''; // Reset input
        });

        // Event Listeners
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);

        audio.addEventListener('timeupdate', () => {
            const current = audio.currentTime;
            const duration = audio.duration;
            if (duration) {
                const progressPercent = (current / duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
                timeCurrent.textContent = formatTime(current);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            timeTotal.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', nextTrack);

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // Initialize App
        init();
    </script>
</body>
</html>
